<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pip · moods</title>
<!-- Every mood of Pip, the inbox buddy, drawn large. Serve the repo folder and open /preview/pip.html (?dark for dark). -->
<style>
  body{margin:0;padding:32px;background:#f6f8fc;color:#1f1f1f;font:14px/20px "Google Sans",Roboto,Arial,sans-serif;
    --card:#fff;--line-2:rgba(31,31,31,.14);--hover:rgba(31,31,31,.045);--t1:#1f1f1f;--ease:cubic-bezier(.2,.8,.2,1);
    --shadow-up:0 2px 6px rgba(60,64,67,.08),0 12px 28px -10px rgba(60,64,67,.18)}
  body.dark{background:#131314;color:#e3e3e3;--card:#1e1f20;--line-2:rgba(255,255,255,.16);--hover:rgba(255,255,255,.06);--t1:#e3e3e3}
  h1{margin:0 0 4px;font-size:22px;font-weight:400}
  p{margin:0 0 24px;color:#5e5e5e}
  .grid{display:grid;grid-template-columns:repeat(4,200px);gap:16px}
  .cell{background:var(--card);border-radius:20px;padding:16px 16px 12px;text-align:center}
  .stage{position:relative;height:150px;display:flex;align-items:center;justify-content:center}
  .stage .pip-slot{position:static;transform:scale(3);transform-origin:center}
  .stage .pip-bubble{display:none}
  .cell b{display:block;font-weight:500;margin-top:4px}
  .cell span{font-size:12px;color:#5e5e5e}
  .dark .cell span,.dark p{color:#9aa0a6}
</style>
</head>
<body>
<h1>Pip, the inbox buddy</h1>
<p>Every mood, drawn three times larger than in Gmail. The bottom row plays its moves in a loop.</p>
<div class="wrap motion-on" id="wrap"><div class="grid" id="grid"></div></div>
<script src="../extension/pip.js"></script>
<script>
  if (location.search.includes('dark')) { document.body.classList.add('dark'); document.getElementById('wrap').classList.add('dark'); }
  const style = document.createElement('style');
  style.textContent = globalThis.__inboxPip().css;
  document.head.appendChild(style);
  const cells = [
    ['idle', 'Idle', 'Breathes, blinks, follows your pointer'],
    ['happy', 'Happy', 'New mail, a poke, waking up'],
    ['thinking', 'Thinking', 'While the blocks update'],
    ['alert', 'Alert', 'An account alert is unread'],
    ['sad', 'Sad', "Couldn't update"],
    ['sleep', 'Asleep', 'After 90 seconds without you'],
    ['wink', 'Wink', 'You copied a code'],
    ['idle', 'Delivery', 'Flap opens, a letter pops out', 'deliver'],
    ['idle', 'Hop', 'Random, or when you poke it', 'hop'],
    ['idle', 'Wiggle', 'Random', 'wiggle'],
    ['happy', 'Spin', 'Rare, random', 'spin'],
    ['alert', 'Shake', 'Alert reminder', 'shake']
  ];
  const grid = document.getElementById('grid');
  cells.forEach(([mood, name, note, move]) => {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.innerHTML = '<div class="stage"><div class="pip-slot"></div></div><b>' + name + '</b><span>' + note + '</span>';
    grid.appendChild(cell);
    const p = globalThis.__inboxPip();
    p.setMotion(true);
    p.mount(cell.querySelector('.pip-slot'));
    const svg = cell.querySelector('.pip');
    const hold = () => { svg.dataset.mood = mood; };
    hold();
    setInterval(hold, 300);
    if (move) {
      const play = () => {
        if (move === 'deliver') { svg.classList.add('open', 'sparkle'); svg.dataset.mood = 'happy'; setTimeout(() => svg.classList.remove('open', 'sparkle'), 1900); return; }
        svg.classList.remove(move); void svg.getBoundingClientRect(); svg.classList.add(move);
        setTimeout(() => svg.classList.remove(move), 900);
      };
      play();
      setInterval(play, 2600);
    }
  });
</script>
</body>
</html>
